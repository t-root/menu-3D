<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu3D - Interactive 3D Menu</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    .info-stack {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #fff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.85);
      z-index: 10;
      user-select: none;
    }

    .info-title {
      font-size: 32px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .info-hint {
      font-size: 16px;
      opacity: 0.9;
      line-height: 1.6;
    }
    .menu-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ccc;
      z-index: 10;
    } 
  </style>
</head>

<body>
  <div class="menu-container"></div>
  <div class="info-stack">
    <div class="info-title">Menu3D Demo</div>
    <div class="info-hint">
      • Click the floating icon to show or hide the 3D menu<br />
      • Drag to rotate • Scroll to fine-tune the angle • Hover to pause auto-spin
    </div>
  </div>
  <button class="menu-toggle-btn" aria-label="Toggle 3D menu">☰</button>

  <!-- Gọi file script -->
  <script src="/main/index.js"></script>
</body>

</html>
